<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Niña Hermosa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&display=swap');

        body {
            background-color: #fffde7; /* Amarillo muy pálido */
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evita barras de desplazamiento */
            font-family: 'Dancing Script', cursive;
        }

        /* --- Contenedor de Texto Superior --- */
        .text-container {
            position: relative;
            text-align: center;
            padding-top: 2vh;
            z-index: 100; /* Siempre por encima */
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1; /* Ocupa el espacio superior */
            justify-content: center;
        }

        .main-title {
            font-family: 'Great Vibes', cursive; /* Fuente más festiva */
            font-size: 3.5rem;
            color: #fbc02d;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            animation: fadeIn 2s ease-out;
        }

        .personal-message {
            font-size: 1.5rem;
            color: #5d4037; /* Marrón suave */
            line-height: 1.6;
            margin-top: 15px;
            max-width: 80%;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards 1s; /* Aparece después */
        }

        /* --- El Jardín de Lirios Altos --- */
        .garden {
            display: flex;
            justify-content: space-around;
            width: 100%;
            align-items: flex-end; /* Lirios desde la base */
            padding-bottom: 2vh;
            position: relative;
        }

        .lily {
            position: relative;
            transform-origin: bottom center;
            animation: sway 5s ease-in-out infinite;
        }

        /* Variaciones manuales (escala y delay) */
        .l1 { transform: scale(1); }
        .l2 { animation-delay: 1s; transform: scale(0.9); }
        .l3 { animation-delay: 2s; transform: scale(1.1); }
        .l4 { animation-delay: 0.5s; transform: scale(0.8); }
        .l5 { animation-delay: 1.5s; transform: scale(1); }

        /* --- Estructura de la Flor --- */
        .tepal {
            position: absolute;
            width: 35px;
            height: 80px;
            background: linear-gradient(#fff9c4, #ffeb3b, #fbc02d);
            border-radius: 50% 50% 10% 10%;
            transform-origin: bottom center;
            left: 50%;
            margin-left: -17.5px;
            top: -350px; /* Punto alto debido al tallo */
        }

        /* Rotaciones de los pétalos */
        .t1 { transform: rotate(0deg); } .t2 { transform: rotate(60deg); }
        .t3 { transform: rotate(120deg); } .t4 { transform: rotate(180deg); }
        .t5 { transform: rotate(240deg); } .t6 { transform: rotate(300deg); }

        .center {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #5d4037;
            border-radius: 50%;
            top: -280px; /* Ajuste centro */
            left: 50%;
            margin-left: -10px;
            z-index: 10;
        }

        /* --- El Tallo Largo --- */
        .stem {
            width: 10px;
            height: 350px;
            background: linear-gradient(#4caf50, #2e7d32);
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        /* --- Corazones de Fondo (JS) --- */
        .heart-particle {
            position: absolute;
            color: #ffb74d; /* Naranja melocotón suave */
            opacity: 0.8;
            pointer-events: none; /* No interfieren clics */
            z-index: 1; /* Por DETRÁS de las flores */
            animation: floatUp linear infinite;
        }

        /* --- Animaciones --- */
        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="text-container">
        <h1 class="main-title">Un ramito de lirios</h1>
        <p class="personal-message">
            mi niña hermosa <br>
            te amo con toda mi alma mi vida hermosa <br>
            te mereces esto y mucho más <br>
            la distancia nos podra separar pero no impedira que te de tu ramito <br>
            asi no eres espectadora mi vida :3  
        </p>
    </div>

    <div class="garden">
        <div class="lily l1"><div class="tepal t1"></div><div class="tepal t2"></div><div class="tepal t3"></div><div class="tepal t4"></div><div class="tepal t5"></div><div class="tepal t6"></div><div class="center"></div><div class="stem"></div></div>
        <div class="lily l2"><div class="tepal t1"></div><div class="tepal t2"></div><div class="tepal t3"></div><div class="tepal t4"></div><div class="tepal t5"></div><div class="tepal t6"></div><div class="center"></div><div class="stem" style="height: 280px;"></div></div>
        <div class="lily l3"><div class="tepal t1"></div><div class="tepal t2"></div><div class="tepal t3"></div><div class="tepal t4"></div><div class="tepal t5"></div><div class="tepal t6"></div><div class="center"></div><div class="stem" style="height: 400px;"></div></div>
        <div class="lily l4"><div class="tepal t1"></div><div class="tepal t2"></div><div class="tepal t3"></div><div class="tepal t4"></div><div class="tepal t5"></div><div class="tepal t6"></div><div class="center"></div><div class="stem" style="height: 320px;"></div></div>
        <div class="lily l5"><div class="tepal t1"></div><div class="tepal t2"></div><div class="tepal t3"></div><div class="tepal t4"></div><div class="tepal t5"></div><div class="tepal t6"></div><div class="center"></div><div class="stem"></div></div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤'; // Usamos el símbolo de texto

            // --- Configuraciones Aleatorias ---
            // Posición horizontal (0 a 100% ancho)
            heart.style.left = Math.random() * 100 + "vw";
            
            // Tamaño aleatorio (entre 10px y 30px)
            const size = Math.random() * 20 + 10 + "px";
            heart.style.fontSize = size;
            
            // Duración aleatoria de la subida (entre 4 y 9 segundos)
            const duration = Math.random() * 5 + 4 + "s";
            heart.style.animationDuration = duration;
            
            // Opacidad inicial aleatoria para dar profundidad
            heart.style.opacity = Math.random() * 0.5 + 0.3;

            document.body.appendChild(heart);

            // Importante: Eliminarlo del DOM después de que suba
            setTimeout(() => {
                heart.remove();
            }, 9000); 
        }

        // Crear un corazón nuevo cada 300 milisegundos
        setInterval(createHeart, 300);
    </script>

</body>
</html>
